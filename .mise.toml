[tools]
go = "1.26"

[tasks.build]
description = "build the filet binary into ./bin"
run = "go build -o bin/filet . && ln -sf filet bin/droast"

[tasks.test]
description = "run the unit tests"
run = "go test ./..."

[tasks.fmt]
description = "check formatting"
run = ["test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"]

[tasks.check]
description = "vet, format check and self-roast"
depends = ["fmt"]
run = ["go vet ./...", "go run . roast ."]

[tasks.install]
description = "install filet and droast into GOBIN"
run = [
  "go install .",
  "ln -sf \"$(go env GOPATH)/bin/filet\" \"$(go env GOPATH)/bin/droast\"",
]
