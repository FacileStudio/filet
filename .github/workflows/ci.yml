name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go mod tidy leaves nothing behind
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: tests
        run: go test -race -count=1 ./...

      - name: filet holds itself to its own defaults
        id: check
        run: go run . check . -fail error -format text

      - name: report to antenne
        if: always()
        env:
          ANTENNE_URL: ${{ secrets.ANTENNE_FILET_SECRET != '' && 'https://antenne.facile.studio/webhook/filet' || '' }}
          ANTENNE_SECRET: ${{ secrets.ANTENNE_FILET_SECRET }}
        run: |
          set -uo pipefail
          [ -n "$ANTENNE_URL" ] || exit 0
          report="${RUNNER_TEMP}/filet.json"

          go run . check . -format json -fail never > "$report"
          status=failure
          [ "${{ steps.check.outcome }}" = "success" ] && status=success

          warn() {
            echo "::warning title=filet::could not report the run to Antenne: $1"
            exit 0
          }

          branch="$(jq -r '.pull_request.head.ref // ""' "$GITHUB_EVENT_PATH")"
          [ -n "$branch" ] || branch="$GITHUB_REF_NAME"
          default_branch="$(jq -r '.repository.default_branch // "main"' "$GITHUB_EVENT_PATH")"

          payload="${RUNNER_TEMP}/filet-antenne.json"
          jq --arg repository "$GITHUB_REPOSITORY" \
             --arg branch "$branch" \
             --arg defaultBranch "$default_branch" \
             --arg commit "$GITHUB_SHA" \
             --arg actor "$GITHUB_ACTOR" \
             --arg status "$status" \
             --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
             '{repository: $repository, branch: $branch, defaultBranch: $defaultBranch,
               commit: $commit, actor: $actor, status: $status, runUrl: $runUrl,
               grade: .grade, files: .files, lines: .lines, counts: .counts,
               findings: .findings[:20]}' "$report" > "$payload" || warn "could not build the payload"

          signature="sha256=$(openssl dgst -sha256 -hmac "$ANTENNE_SECRET" -hex < "$payload" | sed 's/^.*= //')" \
            || warn "could not sign the payload"

          response="$(curl --silent --show-error --fail-with-body --max-time 20 \
            -X POST "$ANTENNE_URL" \
            -H 'content-type: application/json' \
            -H "x-filet-signature-256: ${signature}" \
            --data-binary "@${payload}" 2>&1)" || warn "${response}"

  build:
    # The treesitter tier is a mandatory cgo package, so every release target
    # needs a native C toolchain: zig for the linux cross-targets, clang + the
    # macOS SDK for darwin. One macos runner covers all; the goreleaser config
    # is the single source of truth for the per-target toolchain flags, same as
    # the release workflow.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2

      - name: Resolve macOS SDK
        id: macos_sdk
        run: echo "path=$(xcrun --show-sdk-path)" >> $GITHUB_OUTPUT

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --clean --snapshot
        env:
          SDK_PATH: ${{ steps.macos_sdk.outputs.path }}
